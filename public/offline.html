<!DOCTYPE html>
<html lang="es-GT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión · Quetzalito</title>
  <link rel="icon" href="/logo.webp" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: #F8FAFC; color: #0F172A; padding: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0F172A; color: #F1F5F9; }
      .card { background: #1E293B; border-color: #334155; }
    }
    .card {
      max-width: 420px; width: 100%;
      background: white; border: 1px solid #E2E8F0;
      border-radius: 1.5rem; padding: 2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 0.75rem; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    p { margin: 0 0 1.5rem; color: #64748B; line-height: 1.5; }
    button {
      width: 100%; padding: .75rem 1rem;
      background: #10B981; color: white;
      border: 0; border-radius: 0.75rem;
      font-weight: 600; font-size: 0.875rem;
      cursor: pointer;
    }
    button:hover { background: #059669; }
    .hint { margin-top: 1rem; font-size: 0.75rem; color: #94A3B8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Sin conexión</h1>
    <p>
      No pudimos cargar esta página. Si registraste un movimiento, no te preocupes:
      lo guardamos localmente y se va a sincronizar apenas vuelvas a tener internet.
    </p>
    <button onclick="location.reload()">Reintentar</button>
    <p class="hint">Quetzalito · Tu dinero bajo control</p>
  </div>
</body>
</html>
